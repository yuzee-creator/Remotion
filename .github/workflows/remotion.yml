name: Remotion Render
on:
  workflow_dispatch:
    inputs:
      id:
        description: "ID render"
        required: true
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion/package.json
      - name: Lib Chromium
        run: sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - name: Install
        working-directory: remotion
        run: npm install
      - name: Render
        working-directory: remotion
        run: npx remotion render src/index.ts Main out.mp4 --concurrency=2
      - name: Upload ke Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "render-${{ inputs.id }}" remotion/out.mp4 --title "render-${{ inputs.id }}" --notes "auto"
